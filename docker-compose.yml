services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: translog
      POSTGRES_PASSWORD: ${DB_PASSWORD:-translog_dev}
      POSTGRES_DB: translog
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translog -d translog"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: translog
      DB_PASSWORD: ${DB_PASSWORD:-translog_dev}
      DB_NAME: translog
      DB_SYNCHRONIZE: "true"
      JWT_SECRET: ${JWT_SECRET:-translog-demo-only-local-change-before-production-2026}
      BOOTSTRAP_SUPERVISOR_EMAIL: ${BOOTSTRAP_SUPERVISOR_EMAIL:-admin@example.test}
      BOOTSTRAP_SUPERVISOR_PASSWORD: ${BOOTSTRAP_SUPERVISOR_PASSWORD:-admin}
      BOOTSTRAP_SUPERVISOR_NAME: ${BOOTSTRAP_SUPERVISOR_NAME:-Admin}
      CORS_ORIGIN: http://localhost:4200
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:4200:4200"]
    depends_on: [backend]
volumes:
  postgres_data:
